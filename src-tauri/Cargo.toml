[package]
name = "bookee"
version = "0.1.3"
description = "Bookee — local-first, read-only bookkeeping for Stellar accounts."
authors = ["Bookee contributors"]
license = "Apache-2.0"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "bookee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
# No static scope is configured for fs: the dialog plugin grants access to
# exactly the file the user picked (allow_file), and nothing else.
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Must track the sqlx version used by tauri-plugin-sql (0.8) so that the pool
# borrowed in sql_batch.rs is the same type. Features mirror the plugin's
# `sqlite` feature: sqlx/sqlite + sqlx/runtime-tokio.
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }

# Desktop only: replacing the installed binary is meaningless on mobile, and
# the updater plugin does not build for those targets. `process` is here purely
# so the app can relaunch itself once an update has been written into place.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
