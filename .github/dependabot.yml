version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than a stream of them; this is a small
      # project and a weekly batch is reviewable, twenty PRs are not.
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # sqlx is declared only to match the version tauri-plugin-sql resolves, so
      # that sql_batch.rs can borrow the plugin's own pool as the same type. A
      # 0.9 bump here changes only our requirement, leaving the plugin on 0.8:
      # two sqlx versions in one build, which cannot compile. Both update-types
      # are listed because Dependabot classifies 0.x bumps inconsistently.
      # Lift this when tauri-plugin-sql moves to 0.9, and bump the two together.
      - dependency-name: "sqlx"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
